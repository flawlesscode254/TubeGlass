[package]
name = "tubeglass"
version = "0.2.1"
edition = "2024"
description = "A YouTube, YouTube Music and podcast desktop client - no account or API key needed"
license = "MIT"
repository = "https://github.com/flawlesscode254/TubeGlass"
readme = "README.md"
keywords = ["youtube", "podcast", "music", "player", "egui"]
categories = ["multimedia"]

[dependencies]
cpal = "0.18.2"
dirs = "7.0.0"
eframe = "0.37.0"
egui_extras = { version = "0.37.0", features = ["all_loaders"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rfd = "0.17.2"
roxmltree = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = { version = "3.4.2", features = ["json"] }

# media keys and "now playing" over D-Bus exist on Linux only
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.19.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

# the Windows executable carries the app icon
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
